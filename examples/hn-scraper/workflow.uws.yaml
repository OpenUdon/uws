uws: "1.5.0"
info:
  title: Hacker News Front Page Scraper
  summary: >
    Fetches three concurrent pages of HN front-page stories, merges the
    combined story-id list, then fans out in batches to fetch comment threads
    for every story. Demonstrates parallelGroup, merge, loop with batchSize,
    and microdata with property selectors.
  version: "1.0.0"

sourceDescriptions:
  - name: hackernews
    type: browser-profile
    url: ./browser-profiles/hackernews.yaml

operations:
  - operationId: fetch_page
    description: >
      Fetches one numbered page of the HN front page. The page number is
      supplied by the calling step's inputs binding.
    sourceDescription: hackernews
    sourceOperationId: list_stories
    request:
      body:
        page: "$inputs.page"
    successCriteria:
      - condition: "$response.body.stories != null"
    outputs:
      story_ids: "$response.body.story_ids"
      has_more: "$response.body.has_more"

  - operationId: fetch_comments
    description: >
      Fetches the comment thread for a single story. The item_id is supplied
      by the calling loop step via $inputs.item_id.
    sourceDescription: hackernews
    sourceOperationId: get_story_comments
    request:
      body:
        item_id: "$inputs.item_id"
    successCriteria:
      - condition: "$response.statusCode == 200"
    outputs:
      comments: "$response.body.comments"
      authors: "$response.body.authors"

workflows:
  - workflowId: scrape_hn_front_page
    type: sequence
    description: >
      Three front-page fetches run in parallel (parallelGroup: page_group),
      a merge step joins their story-id arrays, and a loop step fans out
      in batches of comment_batch_size to fetch threads.
    inputs:
      type: object
      properties:
        # Number of comment fetches to run concurrently in each loop batch.
        comment_batch_size:
          type: integer
    steps:
      # ── Parallel page fetches ────────────────────────────────────────────
      - stepId: page1
        operationRef: fetch_page
        parallelGroup: page_group
        inputs:
          page: 1
        outputs:
          story_ids: "$response.body.story_ids"

      - stepId: page2
        operationRef: fetch_page
        parallelGroup: page_group
        inputs:
          page: 2
        outputs:
          story_ids: "$response.body.story_ids"

      - stepId: page3
        operationRef: fetch_page
        parallelGroup: page_group
        inputs:
          page: 3
        outputs:
          story_ids: "$response.body.story_ids"

      # ── Merge all three id lists into one ────────────────────────────────
      - stepId: merge_pages
        type: merge
        description: Combine story_ids from all three pages into a single array.
        dependsOn: [page_group]
        outputs:
          story_ids: "$steps.page1.outputs.story_ids"

      # ── Loop over every story id in batches to fetch comments ─────────────
      - stepId: fetch_all_comments
        operationRef: fetch_comments
        dependsOn: [merge_pages]
        forEach: "$steps.merge_pages.outputs.story_ids"
        batchSize: "$inputs.comment_batch_size"
        inputs:
          item_id: "$item"
        outputs:
          thread: "$response.body"

      # ── Final merge ───────────────────────────────────────────────────────
      - stepId: collect
        type: merge
        description: Aggregate all comment threads into the workflow output.
        dependsOn: [fetch_all_comments]

    outputs:
      all_threads: "$steps.collect.outputs"

results:
  - name: hn_comment_threads
    kind: merge
    from: scrape_hn_front_page.collect
    value: "$steps.collect.outputs"
