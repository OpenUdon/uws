openapi: 3.0.0
info:
  title: Synthetic Project API
  version: 1.0.0
servers:
  - url: https://api.example.test
paths:
  /projects:
    get:
      operationId: listProjects
      summary: List projects.
      parameters:
        - name: page_size
          in: query
          required: true
          schema:
            type: integer
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: Project page.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
