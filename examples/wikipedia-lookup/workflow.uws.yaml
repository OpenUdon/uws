uws: "1.5.0"
info:
  title: Wikipedia Article Lookup
  summary: >
    Navigates to a Wikipedia article by title, detects disambiguation pages
    and retries with a qualified title if needed (via a switch step), then
    extracts the article name, description, and categories. Demonstrates
    switch with cases/default, step inputs binding, microdata with property,
    and CSS fallback extraction.
  version: "1.0.0"

sourceDescriptions:
  - name: wikipedia
    type: browser-profile
    url: ./browser-profiles/wikipedia.yaml

operations:
  - operationId: go_to_article
    description: >
      Navigates to a Wikipedia page for the given title and signals whether
      it landed on a disambiguation page.
    sourceDescription: wikipedia
    sourceOperationId: navigate_to_article
    request:
      body:
        title: "$inputs.title"
    successCriteria:
      - condition: "$response.statusCode == 200"
    outputs:
      is_disambiguation: "$response.body.is_disambiguation"
      page_title: "$response.body.page_title"

  - operationId: extract_content
    description: >
      Extracts structured data from the currently loaded article page.
      No navigation is performed; the browser is assumed to already be on
      the correct article after the navigate step.
    sourceDescription: wikipedia
    sourceOperationId: extract_article
    successCriteria:
      - condition: "$response.body.name != null"
    outputs:
      name: "$response.body.name"
      description: "$response.body.description"
      categories: "$response.body.categories"
      article_url: "$response.body.article_url"

workflows:
  - workflowId: lookup_article
    type: sequence
    description: >
      Step 1 navigates to the article. Step 2 is a switch: if the page is a
      disambiguation page it navigates again using the fully qualified title;
      the default branch is a no-op merge. Step 3 extracts article content.
      Step 4 is a merge that surfaces the result.
    inputs:
      type: object
      required: [title]
      properties:
        # Unqualified Wikipedia article title to look up, e.g. "Python".
        title:
          type: string
        # Parenthetically qualified title used when disambiguation is detected,
        # e.g. "Python_(programming_language)". Optional: only needed if title
        # is ambiguous.
        qualified_title:
          type: string

    steps:
      # ── Step 1: navigate to article ───────────────────────────────────────
      - stepId: navigate
        operationRef: go_to_article
        inputs:
          title: "$inputs.title"
        outputs:
          is_disambiguation: "$response.body.is_disambiguation"
          page_title: "$response.body.page_title"

      # ── Step 2: handle disambiguation if needed ───────────────────────────
      - stepId: handle_disambiguation
        type: switch
        dependsOn: [navigate]
        cases:
          - name: disambiguation
            when: "$steps.navigate.outputs.is_disambiguation == true"
            steps:
              - stepId: navigate_qualified
                operationRef: go_to_article
                inputs:
                  title: "$inputs.qualified_title"
                outputs:
                  page_title: "$response.body.page_title"
        default:
          - stepId: no_disambiguation
            type: merge
            description: Article landed directly; no retry needed.
            dependsOn: [navigate]

      # ── Step 3: extract content from whichever page we landed on ──────────
      - stepId: extract
        operationRef: extract_content
        dependsOn: [handle_disambiguation]
        outputs:
          name: "$response.body.name"
          description: "$response.body.description"
          categories: "$response.body.categories"
          article_url: "$response.body.article_url"

      # ── Step 4: surface the result ────────────────────────────────────────
      - stepId: collect
        type: merge
        description: Aggregate article fields into the workflow output.
        dependsOn: [extract]

    outputs:
      article: "$steps.extract.outputs"

results:
  - name: wikipedia_article
    kind: merge
    from: lookup_article.collect
    value: "$steps.extract.outputs"
