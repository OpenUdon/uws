profile: uws.browser.1.5
info:
  title: Wikipedia
  origin: https://en.wikipedia.org
  loginStateRequired: false

observationKind: accessibility_snapshot

evidence:
  learnedAt: "2026-05-31T00:00:00Z"
  source: reviewed_browser_session

confidence: high
expiresAfter: P90D

verification:
  lastVerifiedAt: "2026-05-31T00:00:00Z"
  successfulRuns: 5
  uiStabilityScore: 0.98

actions:
  navigate_to_article:
    description: >
      Navigates to a Wikipedia article by its page title. The title is used
      directly in the URL path. After navigation the action inspects whether
      the landed page is a disambiguation page by checking for the presence of
      the disambiguation footer link in the accessibility tree.
    parameters:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: >
            Wikipedia page title, URL-encoded if necessary. Use the unqualified
            title for the first attempt (e.g. "Python") and the qualified
            title with parenthetical disambiguator on retry
            (e.g. "Python_(programming_language)").
    sequence:
      - navigate: "/wiki/{{title}}"
      - wait_for: { navigation: domcontentloaded }
    outputs:
      is_disambiguation:
        type: boolean
        source: a11y
        presence: true
        locator: { role: link, name: "Disambiguation" }
      page_title:
        type: string
        source: microdata
        property: name
    sideEffects: [read_only]
    confirmationPolicy:
      required: false

  extract_article:
    description: >
      Extracts the canonical name, short description, and first-level
      categories of the currently loaded Wikipedia article. Uses schema.org
      microdata embedded in the page head for name and description; extracts
      categories via CSS because they are not exposed as microdata.
    parameters:
      type: object
      properties: {}
    sequence:
      - wait_for: { role: heading }
    outputs:
      name:
        type: string
        source: microdata
        property: name
      description:
        type: string
        source: microdata
        property: description
      categories:
        type: array
        source: css
        selector: "#mw-normal-catlinks ul li a"
        fallbackReason: no_a11y_region
        validation:
          type: array
          items: { type: string }
      article_url:
        type: string
        source: microdata
        property: url
    sideEffects: [read_only]
    confirmationPolicy:
      required: false
