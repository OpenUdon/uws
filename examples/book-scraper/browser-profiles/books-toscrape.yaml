profile: uws.browser.1.5
info:
  title: Books to Scrape
  origin: https://books.toscrape.com
  loginStateRequired: false

observationKind: accessibility_snapshot

evidence:
  learnedAt: "2026-05-31T00:00:00Z"
  source: reviewed_browser_session

confidence: high
expiresAfter: P90D

verification:
  lastVerifiedAt: "2026-05-31T00:00:00Z"
  successfulRuns: 3
  uiStabilityScore: 0.97

actions:
  list_books_by_category:
    description: >
      Navigates to a catalogue category page and extracts the title, price,
      star rating, and availability of every book listed on that page.
    parameters:
      type: object
      required: [category_path]
      properties:
        category_path:
          type: string
          description: >
            URL path segment for the category, e.g.
            "catalogue/category/books/mystery_3/index.html"
    sequence:
      - navigate: "/{{category_path}}"
      - wait_for: { navigation: domcontentloaded }
    outputs:
      book_paths:
        type: array
        source: microdata
      page_title:
        type: string
        source: microdata
      prices:
        type: array
        source: microdata
      ratings:
        type: array
        source: microdata
    sideEffects: [read_only]
    confirmationPolicy:
      required: false

  get_book_detail:
    description: >
      Opens a single book detail page and extracts its full description,
      UPC, price excluding tax, price including tax, tax amount, and stock
      count.
    parameters:
      type: object
      required: [book_path]
      properties:
        book_path:
          type: string
          description: >
            Relative URL to the book detail page, e.g.
            "catalogue/a-light-in-the-attic_1000/index.html"
    sequence:
      - navigate: "/{{book_path}}"
      - wait_for: { navigation: domcontentloaded }
    outputs:
      title:
        type: string
        source: a11y
        locator: { role: status, name: "Product Description" }
      upc:
        type: string
        source: microdata
      price_excl_tax:
        type: string
        source: microdata
      price_incl_tax:
        type: string
        source: microdata
      tax:
        type: string
        source: microdata
      availability:
        type: string
        source: a11y
        locator: { role: status, name: "Availability" }
      stock_count:
        type: integer
        source: css
        selector: ".instock.availability"
        fallbackReason: no_a11y_region
        validation:
          type: string
          pattern: "^In stock \\(\\d+ available\\)$"
    sideEffects: [read_only]
    confirmationPolicy:
      required: false

  go_to_next_page:
    description: >
      Clicks the "next" pagination link on a catalogue listing page to
      advance to the following page of results. Fails closed if no "next"
      link is present (last page).
    parameters:
      type: object
      properties: {}
    sequence:
      - click:
          locator: { role: link, name: "next" }
          wait_for: { navigation: domcontentloaded }
    sideEffects: [read_only]
    confirmationPolicy:
      required: false
