profile: uws.browser.1.5
info:
  title: Quotes to Scrape
  origin: https://quotes.toscrape.com
  loginStateRequired: true   # runtime supplies a pre-authenticated session

observationKind: accessibility_snapshot

evidence:
  learnedAt: "2026-05-31T00:00:00Z"
  source: reviewed_browser_session

confidence: high
expiresAfter: P90D

verification:
  lastVerifiedAt: "2026-05-31T00:00:00Z"
  successfulRuns: 3
  uiStabilityScore: 0.96

# Login flows, credential resolution, and session management are runtime-owned
# and MUST NOT appear in this profile. The runtime binds a pre-authenticated
# cookie jar or browser profile at execution time.

actions:
  list_quotes:
    description: >
      Loads the home (or paginated) quote listing and extracts every quote
      text, its author, and the tags attached to it.
    parameters:
      type: object
      properties:
        page:
          type: integer
          description: >
            1-based page number. Omit or set to 1 for the first page.
    sequence:
      - navigate: "/page/{{page}}"
      - wait_for: { navigation: domcontentloaded }
    outputs:
      quotes:
        type: array
        source: microdata
      authors:
        type: array
        source: microdata
      tags:
        type: array
        source: microdata
      has_next:
        type: boolean
        source: a11y
        locator: { role: link, name: "Next" }
        presence: true
    sideEffects: [read_only]
    confirmationPolicy:
      required: false

  list_quotes_by_tag:
    description: >
      Navigates to the filtered listing for a single tag and extracts quotes
      and authors on that page.
    parameters:
      type: object
      required: [tag]
      properties:
        tag:
          type: string
          description: Tag slug exactly as it appears in the URL, e.g. "love".
        page:
          type: integer
          description: 1-based page number within the tag listing.
    sequence:
      - navigate: "/tag/{{tag}}/page/{{page}}"
      - wait_for: { navigation: domcontentloaded }
    outputs:
      quotes:
        type: array
        source: microdata
      authors:
        type: array
        source: microdata
      has_next:
        type: boolean
        source: a11y
        locator: { role: link, name: "Next" }
        presence: true
    sideEffects: [read_only]
    confirmationPolicy:
      required: false

  get_author_detail:
    description: >
      Opens an author biography page and extracts the author's full name,
      birth date, birth location, and description.
    parameters:
      type: object
      required: [author_slug]
      properties:
        author_slug:
          type: string
          description: >
            Author URL slug as it appears in /author/<slug>/, e.g.
            "Albert-Einstein".
    sequence:
      - navigate: "/author/{{author_slug}}"
      - wait_for: { navigation: domcontentloaded }
    outputs:
      name:
        type: string
        source: css
        selector: ".author-title"
        fallbackReason: no_a11y_region
        validation:
          type: string
      born:
        type: string
        source: microdata
      location:
        type: string
        source: microdata
      description:
        type: string
        source: css
        selector: ".author-description"
        fallbackReason: no_a11y_region
        validation:
          type: string
    sideEffects: [read_only]
    confirmationPolicy:
      required: false

  add_quote:
    description: >
      Submits a new quote via the authenticated /quote/add form. Requires a
      live authenticated session; the runtime MUST confirm before submitting.
    parameters:
      type: object
      required: [author, text, tags]
      properties:
        author:
          type: string
        text:
          type: string
        tags:
          type: string
          description: Comma-separated tag list to enter in the Tags field.
    sequence:
      - navigate: "/quote/add"
      - wait_for: { navigation: domcontentloaded }
      - type_text:
          locator: { role: textbox, name: "Author" }
          value: "{{author}}"
      - type_text:
          locator: { role: textbox, name: "Text" }
          value: "{{text}}"
      - type_text:
          locator: { role: textbox, name: "Tags" }
          value: "{{tags}}"
      - click:
          locator: { role: button, name: "Submit" }
          wait_for: { navigation: load }
    sideEffects: [creates_record]
    confirmationPolicy:
      required: true
      prompt: >
        Add quote by "{{author}}" with tags [{{tags}}]?
